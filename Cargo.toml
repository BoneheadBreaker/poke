[package]
name = "poke"
version = "0.1.0"
description = "TUI file explorer made in r, as a project to learn rust"
authors = ["BoneheadBreaker <bhb@tutamail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
color-eyre = "0.6.5"
edit = "0.1.5"
ratatui-textarea = "0.9.4"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
